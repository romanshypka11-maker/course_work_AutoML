services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/backend
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY in .env before starting Docker Compose}
      BASE_URL: ${BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      NAME_MODEL: ${NAME_MODEL:-gemini-2.5-flash}
      AUTOML_MAX_ITERATIONS: ${AUTOML_MAX_ITERATIONS:-3}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-300}
