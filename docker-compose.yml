services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/backend
    environment:
      -  MODEL_API_KEY=${MODEL_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend